# Publish a release when a version tag (v1.2.3) is pushed: build the Swift helpers on an Apple Silicon runner,
# package them with the source (scripts/make-release.sh), and attach the archive and its SHA-256 to a GitHub
# release. get.sh installs the latest release from there.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write  # create the release and upload its files; nothing else

jobs:
  release:
    runs-on: macos-15  # Apple Silicon
    steps:
      - uses: actions/checkout@v7
      - name: Build helpers and package
        run: scripts/make-release.sh
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            dist/freeflow-local-macos-arm64.tar.gz dist/freeflow-local-macos-arm64.tar.gz.sha256 \
            --title "$GITHUB_REF_NAME" --generate-notes
