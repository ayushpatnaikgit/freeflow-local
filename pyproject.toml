[project]
name = "freeflow-local"
version = "0.2.2"
description = "Private, local dictation backend for FreeFlow on Apple Silicon: Orukeet speech-to-text and Gemma 4 cleanup on MLX"
readme = "README.md"
authors = [{ name = "Ayush Patnaik" }]
license = "Apache-2.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.162.0",
    "mlx-lm>=0.32.2",
    "parakeet-mlx>=0.7.0",
    "python-multipart>=0.0.33",
    "uvicorn[standard]>=0.54.0",
]

